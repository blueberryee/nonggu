@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mut:#8b949e;--line:#2a313c;--hot:#ff8a4c;--sel:#1f2a3d;--onink:#0d1117;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mut:#8b949e;--line:#2a313c;--hot:#ff8a4c;--sel:#1f2a3d;--onink:#0d1117;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Noto Sans KR",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 12px 88px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.num{font-family:Oswald,"Noto Sans KR",sans-serif;font-weight:700;letter-spacing:.02em}
.next{background:var(--ink);color:var(--onink);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.next .num{font-size:22px;white-space:nowrap}.next small{opacity:.75;display:block;font-size:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.nav h1{font-size:20px;margin:0}.nav button{width:44px;height:44px;font-size:20px;border-radius:50%}
.nav button:disabled{opacity:.25}
.nav button.chip{width:auto;height:40px;font-size:14px;border-radius:20px;white-space:nowrap;flex:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.d{position:relative;aspect-ratio:1/1.12;background:var(--card);border-radius:8px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center}
.d b{font:500 14px Oswald,sans-serif}.d.t b{background:var(--ink);color:var(--onink);border-radius:10px;padding:0 6px}
.d.s{outline:2px solid var(--ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:3px;padding:0 3px}
.dots i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.d u{position:absolute;right:2px;bottom:2px;text-decoration:none;background:var(--hot);color:#fff;font:700 10px/1 Oswald,sans-serif;padding:2px 4px;border-radius:3px 3px 3px 0}
.e{background:none}
.panel{background:var(--card);border-radius:12px;padding:12px;margin-top:12px}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:500}
.g{display:flex;gap:10px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}
.g:first-of-type{border-top:0}.g.dim{opacity:.5}
.g .tm{font-size:17px;width:48px;flex:none}
.g .bar{width:6px;border-radius:3px;flex:none;background-size:100% 100%}
.g small{display:block;color:var(--mut);font-size:12px;line-height:1.45}
.g em{font-style:normal;color:var(--hot);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--card)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--onink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;height:56px;color:var(--mut);font-weight:500}
.tabs button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.note{color:var(--mut);font-size:13px;margin:10px 0 0}
.more{display:block;width:100%;height:44px;margin-top:8px;border:1.5px solid var(--line);border-radius:8px}
.go{display:inline-block;margin-top:8px;padding:10px 16px;background:var(--ink);color:var(--onink);border-radius:8px}
.ed input,.ed textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row input{min-width:0;flex:1}.row .chip{padding:0 10px;flex:none}.row span{flex:none}
.x{width:40px;height:40px;font-size:20px;color:var(--mut);flex:none}.chip:disabled{opacity:.6}

<div class="row" style="margin:6px 0 0"><span>예매 수수료 1매당</span><input data-f="f:${i}" type="number" inputmode="numeric" value="${fee(t)}" aria-label="예매 수수료" style="max-width:110px"><span>원</span></div><p class="note" id="amt${i}" style="margin:6px 0 0">${amtTxt(t)}</p>
<p class="note" style="margin:10px 0 4px">같이 가는 사람 (예매자 제외, 1인 1매)</p><div class="chips">${pl(t).map((n,j)=>`<button class="chip" aria-pressed="${t.ps.some(p=>p.n===n)}" data-a="sp:${i}-${j}">${q(n)}</button>`).join('')}</div><div class="row"><input id="np${i}" placeholder="이름 직접 입력" aria-label="같이 가는 사람 이름"><button class="chip" data-a="pa:${i}">추가</button></div>
${t.ps.length?`<p class="note" style="margin:10px 0 4px">정산 (${q(t.b)}에게 입금)</p><div class="chips">${t.ps.map((p,k)=>`<button class="chip" aria-pressed="${!!p.p}" data-a="sd:${i}-${k}">${q(p.n)} ${tk(t).toLocaleString()}원 ${p.p?'입금 완료':'미입금'}</button>`).join('')}</div>`:''}</div>`).join('');
 return `<div class="nav"><button data-a="back" aria-label="뒤로">‹</button><h1 style="font-size:17px">${fmt(gdt(g))} ${g[3]} vs ${g[4]}</h1><button class="chip" data-a="edit:${eid}">기록</button></div>
<div class="panel ed"><h2>예매 상태</h2><button class="chip" aria-pressed="${!!r.bk}" data-a="bkr">예매 완료</button></div>${items}<button class="more" data-a="ai">예매 건 추가</button>`}
function setView2(){const fr=`<div class="panel ed"><h2>자주 가는 친구</h2><div class="chips">${S.fr.map((n,i)=>`<button class="chip" data-a="fdel:${i}" aria-label="${q(n)} 삭제">${q(n)} ×</button>`).join('')||'<span class="note">아직 없어요.</span>'}</div><div class="row"><input id="fn" placeholder="이름 입력" aria-label="친구 이름"><button class="chip" data-a="fadd">추가</button></div><p class="note">예매·정산 화면에서 예매자와 같이 가는 사람으로 고를 수 있어요. 내 이름은 나로 고정이에요.</p></div>`;
 return setView().replace('<div class="panel ed"><h2>백업',fr+'<div class="panel ed"><h2>백업')}
function editAct(a,v){
 if(a==='edit'||a==='bp'){pt=(tab==='ed'||tab==='bp')?pt:tab;tab=a==='bp'?'bp':'ed';eid=+v;rec(eid);window.scrollTo(0,0);return 1}
 if(a==='ch'){const x=rec(+v);x.ch=x.ch?0:1;saveR();return 1}
 if(a==='usesc'){const g=G.find(x=>x[0]===eid),s=SC[scKey(g)];if(s){const r=rec(eid);r.hs=s.hs;r.as=s.as;saveR()}return 1}
 if(a==='done'){rec(+v).bk=1;saveR();pt=tab;tab='bp';eid=+v;window.scrollTo(0,0);return 1}
 if(a==='back'){tab=pt;return 1}
 if(a==='fadd'){const n=document.getElementById('fn').value.trim();if(n&&n!=='나'&&!S.fr.includes(n)){S.fr.push(n);save()}return 1}
 if(a==='fdel'){S.fr.splice(+v,1);save();return 1}
 if(a==='exp'){ioText=JSON.stringify({S:S,R:R});ioMsg='';return 1}
 if(a==='imp'){try{const o=JSON.parse(document.getElementById('io').value);if(o.S)S=Object.assign({pref:[],own:[],fr:[]},o.S);if(o.R)R=o.R;save();saveR();ioText='';ioMsg='가져왔어요.'}catch(e){ioMsg='백업 텍스트를 읽지 못했어요. 내용을 확인해 주세요.'}return 1}
 if(tab!=='bp')return 0;
 const r=rec(eid);r.it=r.it||[];const sp=String(v).split('-'),t=r.it[+sp[0]],j=+sp[1];
 if(a==='bkr')r.bk=r.bk?0:1;else if(a==='ai')r.it.push({b:'나',z:'',s:'',q:1,u:0,f:1000,ps:[]});else if(a==='di')r.it.splice(+v,1);
 else if(!t)return 0;
 else if(a==='sb'){t.b=OPT()[j];t.ps=t.ps.filter(p=>p.n!==t.b)}
 else if(a==='sp'){const n=pl(t)[j],k=t.ps.findIndex(p=>p.n===n);k<0?t.ps.push({n:n,p:0}):t.ps.splice(k,1)}
 else if(a==='pa'){const el=document.getElementById('np'+sp[0]),n=((el&&el.value)||'').trim();if(n&&n!==t.b&&!t.ps.some(p=>p.n===n))t.ps.push({n:n,p:0})}
 else if(a==='sd')t.ps[j].p=t.ps[j].p?0:1;else if(a==='qm')t.q=Math.max(1,t.q-1);else if(a==='qp')t.q=Math.min(20,t.q+1);else return 0;
 saveR();return 1}
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f||tab!=='bp')return;const k=f.split(':'),t=(rec(eid).it||[])[+k[1]];if(!t)return;
 if(k[0]==='u')t.u=+e.target.value||0;else if(k[0]==='f')t.f=+e.target.value||0;else if(k[0]==='s')t.s=e.target.value;else return;
 saveR();const a=document.getElementById('amt'+k[1]);if(a)a.textContent=amtTxt(t)});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f||tab!=='bp')return;const k=f.split(':');if(k[0]!=='z')return;
 const g=G.find(x=>x[0]===eid),t=rec(eid).it[+k[1]],p=(PR[g[3]]||{})[e.target.value];t.z=e.target.value;if(p)t.u=gdt(g).getDay()%6===0?p[1]:p[0];saveR();render()});
function render(){const v=tab==='cal'?calView():tab==='bk'?bookView():tab==='ed'?edView():tab==='bp'?bpView():setView2();document.getElementById('app').innerHTML=v;
 document.getElementById('tabs').innerHTML=[['cal','달력'],['bk','예매'],['set','내 설정']].map(t=>`<button data-a="tab:${t[0]}" ${((tab==='ed'||tab==='bp')?pt:tab)===t[0]?'aria-current="true"':''}>${t[1]}</button>`).join('')}
let SC={};
const scKey=g=>g[1]+'|'+g[3]+'|'+g[4];
const scOf=g=>{const r=R[g[0]];if(r&&r.hs!==''&&r.as!==''&&r.hs!=null&&r.as!=null)return[r.hs,r.as];const x=SC[scKey(g)];return x&&x.final?[x.hs,x.as]:null};
function recBadge(g){const r=R[g[0]]||{},t=[];if(r.bk)t.push('예매 완료');else if(r.ch)t.push('예매 도전');const a=scOf(g);if(a)t.push('종료 '+a[0]+':'+a[1]);const u=R[g[0]]?unp(r):0;if(u)t.push('미정산 '+u+'명');return t.length?`<small><em>${t.join(' · ')}</em></small>`:''}
function gameRow(g){const o=opens(g).filter(e=>e.d>now).map(e=>fmt(e.d)+' '+hm(e.d)+' '+e.lab).join(' / ');
 return `<div class="g ${rel(g)?'':'dim'}"><span class="tm num">${g[2]}</span><span class="bar" style="background:${two(g)}"></span><div style="flex:1"><b>${g[3]}</b> 홈 vs ${g[4]}<small>${V[g[3]]}</small>${o?`<small>예매 <em>${o}</em></small>`:''}${recBadge(g)}</div><div style="display:flex;flex-direction:column;gap:6px"><button class="chip" data-a="bp:${g[0]}">예매</button><button class="chip" data-a="edit:${g[0]}">기록</button></div></div>`}
function edView(){const g=G.find(x=>x[0]===eid),r=rec(eid),x=SC[scKey(g)],au=x&&x.final,hv=r.hs!==''?r.hs:(au?x.hs:''),av=r.as!==''?r.as:(au?x.as:'');
 return `<div class="nav"><button data-a="back" aria-label="뒤로">‹</button><h1 style="font-size:17px">${fmt(gdt(g))} ${g[3]} vs ${g[4]}</h1><button class="chip" data-a="bp:${eid}">예매·정산</button></div>
<div class="panel ed"><h2>스코어</h2><div class="row"><span>${g[3]}</span><input data-f="hs" type="number" inputmode="numeric" value="${q(hv)}" style="text-align:center" aria-label="${g[3]} 점수"><span>:</span><input data-f="as" type="number" inputmode="numeric" value="${q(av)}" style="text-align:center" aria-label="${g[4]} 점수"><span>${g[4]}</span></div>${au&&r.hs===''&&r.as===''?'<p class="note">KBL 기록이 자동 반영됐어요. 직접 고치면 내 입력이 우선돼요.</p>':''}</div>
<div class="panel ed"><h2>한줄평</h2><textarea data-f="memo" rows="3" placeholder="오늘 경기는…">${q(r.memo)}</textarea></div>`}
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(tab!=='ed'||(f!=='hs'&&f!=='as'))return;const g=G.find(x=>x[0]===eid),x=SC[scKey(g)],r=rec(eid);if(x&&x.final){if(r.hs==='')r.hs=String(x.hs);if(r.as==='')r.as=String(x.as);saveR()}});
try{fetch('scores.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.games){j.games.forEach(s=>{SC[s.date+'|'+s.home+'|'+s.away]=s});render()}}).catch(()=>{})}catch(e){}
render();
</script>
</body></html>
