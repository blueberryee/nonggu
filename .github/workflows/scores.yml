name: fetch-scores
on:
  workflow_dispatch:
  schedule:
    # 한국 시간 21:30, 23:00, 다음날 00:30 (UTC 12:30, 14:00, 15:30)
    - cron: '30 12 * * *'
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-scores.mjs
      - name: Commit changes
        run: |
          git config user.name "scores-bot"
          git config user.email "scores-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update scores"
          git push
